openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tables
    description: Club table reservation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tables:
    get:
      operationId: getTables
      tags: [tables]
      summary: Get all tables
      parameters:
        - name: date
          in: query
          required: false
          description: Reservation date in YYYY-MM-DD format
          schema:
            type: string
            format: date
      responses:
        "200":
          description: List of tables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClubTable"

  /tables/{id}:
    patch:
      operationId: updateTable
      tags: [tables]
      summary: Update a table's status or price
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: false
          description: Reservation date in YYYY-MM-DD format
          schema:
            type: string
            format: date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTable"
      responses:
        "200":
          description: Updated table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubTable"
        "404":
          description: Table not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ClubTable:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        price:
          type: string
      required:
        - id
        - status
        - price

    UpdateTable:
      type: object
      properties:
        status:
          type: string
        price:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
